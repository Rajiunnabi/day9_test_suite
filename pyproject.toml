[project]
name = "task-tracker-api"
version = "0.2.0"
description = "Day 8 - layered FastAPI architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# --strict-markers turns a typo'd marker into an error instead of a warning.
# Without it `@pytest.mark.integrtion` silently marks nothing, and
# `-m "not integration"` quietly runs the slow tests anyway.
addopts = "-ra --strict-markers --strict-config"

markers = [
    "unit: no database, no network - fakes and mocks only (fast)",
    "integration: talks to the real test database",
    "api: goes through the FastAPI app with TestClient",
    "db: needs PostgreSQL to be running",
    "regression: guards a specific bug that must not come back",
    "slow: takes noticeably longer than the rest",
]

[tool.coverage.run]
source = ["app"]
branch = true          # count both sides of every if, not just the line
omit = ["app/main.py"] # the composition root - exercised, not worth chasing to 100%

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",           # Protocol method bodies
]
# A floor, not a target. High coverage does not mean the tests are good - it
# only means untested code is easy to spot. Raise it when you genuinely cover
# more; never lower it to make a red build green.
fail_under = 85

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
